name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Deliberately minimal. No sentence-transformers (a ~400MB torch
      # download), no openai, and NO API KEY anywhere in this workflow.
      #
      # That is the point: the retrieval pipeline is built so its full
      # test suite and both corpus notebooks run on the TF-IDF+SVD
      # fallback embedder with nothing but the scientific stack. If a
      # change ever makes CI require a credential or a model download,
      # this job fails and the regression is caught immediately.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # streamlit is here so the demo's smoke test runs: the app is
          # the public face of the project and nothing else executes it.
          pip install numpy pandas scikit-learn matplotlib pytest streamlit

      - name: Build corpus and golden set
        run: python -c "from src.corpus.build import write_corpus, write_golden_set; write_corpus(); write_golden_set()"

      - name: Notebooks are in sync with their .py sources
        # A .ipynb that has drifted from its source is a notebook nobody
        # has actually run. Compared on cell content, not bytes: opening
        # a notebook rewrites its kernel metadata, and the byte-for-byte
        # version of this check failed every push on exactly that while
        # no cell had changed.
        run: python scripts/build_notebooks.py --check

      - name: Repo-wide invariants
        # Scans EVERY file, not just the diff. Added after notebook 02 was
        # committed with embedded outputs and survived several commits,
        # because diff-scoped checks never look at files nobody touched.
        run: python scripts/check_repo.py

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Smoke-test notebooks
        run: |
          python notebooks/01_corpus_construction.py > /dev/null
          python notebooks/02_chunking_embedding.py > /dev/null
          python notebooks/03_retrieval_bakeoff.py > /dev/null
          python notebooks/04_generation.py > /dev/null
          python notebooks/05_evaluation.py > /dev/null
          python notebooks/06_judge_analysis.py > /dev/null
          python notebooks/07_decision_memo.py > /dev/null
          python notebooks/08_full_corpus_baseline.py > /dev/null
          python notebooks/09_decision_model.py > /dev/null
          python notebooks/10_measured_answers.py > /dev/null

      - name: Assert the pipeline ran without any credential
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "::error::A credential is set in CI. Phases 1-7 must run without one."
            exit 1
          fi
          echo "Confirmed: no LLM credential present, pipeline passed regardless."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets

      # Scans every tracked file against the committed baseline. Anything
      # that looks like a credential and is not already accounted for
      # fails the build rather than reaching a reviewer.
      #
      # This uses the hook entry point, not `scan --baseline`. `scan`
      # rewrites the baseline's `generated_at` timestamp on every run, so
      # the earlier `git diff --exit-code .secrets.baseline` check failed
      # whether or not anything was found. A check that cannot pass
      # protects nothing: a permanently red job is one people learn to
      # ignore, which is the opposite of what a secret scan is for.
      - name: Scan for committed secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Assert .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "Confirmed: .env is not tracked."
