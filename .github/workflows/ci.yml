name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Deliberately minimal. No sentence-transformers (a ~400MB torch
      # download), no openai, and NO API KEY anywhere in this workflow.
      #
      # That is the point: the retrieval pipeline is built so its full
      # test suite and both corpus notebooks run on the TF-IDF+SVD
      # fallback embedder with nothing but the scientific stack. If a
      # change ever makes CI require a credential or a model download,
      # this job fails and the regression is caught immediately.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn matplotlib pytest

      - name: Build corpus and golden set
        run: python -c "from src.corpus.build import write_corpus, write_golden_set; write_corpus(); write_golden_set()"

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Smoke-test notebooks
        run: |
          python notebooks/01_corpus_construction.py > /dev/null
          python notebooks/02_chunking_embedding.py > /dev/null
          python notebooks/03_retrieval_bakeoff.py > /dev/null
          python notebooks/04_generation.py > /dev/null
          python notebooks/05_evaluation.py > /dev/null

      - name: Assert the pipeline ran without any credential
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "::error::A credential is set in CI. Phases 1-5 must run without one."
            exit 1
          fi
          echo "Confirmed: no LLM credential present, pipeline passed regardless."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets

      # Scans the working tree against the committed baseline. Anything
      # that looks like a credential and is not already accounted for
      # fails the build rather than reaching a reviewer.
      - name: Scan for committed secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code .secrets.baseline \
            || (echo "::error::New potential secret detected. Review before committing." && exit 1)

      - name: Assert .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "Confirmed: .env is not tracked."
